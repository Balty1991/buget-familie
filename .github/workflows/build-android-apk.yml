name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  release-apk:
    name: APK semnat, aceeași cheie ca Play
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Instalează dependențele exacte
        run: pnpm install --frozen-lockfile
      - name: Verifică tipurile
        run: pnpm check
      - name: Verifică stilul codului
        run: pnpm lint
      - name: Rulează testele
        run: pnpm test
      - name: Construiește bundle-ul Android
        run: pnpm run cap:sync
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Pregătește Gradle cu reîncercări
        run: |
          cat >> "$GITHUB_ENV" <<'MEDIU'
          GRADLE_OPTS=-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000
          MEDIU
          cat > "$HOME/gradle-cu-reincercari.sh" <<'SCRIPT'
          gradle_cu_reincercari() {
            for incercare in 1 2 3; do
              if ./gradlew "$@"; then return 0; fi
              echo "::warning::Gradle a picat (încercarea $incercare). Curăț distribuția și reîncerc."
              rm -rf "$HOME/.gradle/wrapper/dists"
              sleep $((incercare * 20))
            done
            echo "::error::Gradle a picat de trei ori la rând."
            return 1
          }
          SCRIPT
          echo "BASH_ENV=$HOME/gradle-cu-reincercari.sh" >> "$GITHUB_ENV"
      - name: Scrie keystore-ul de release din secrete
        working-directory: android/app
        run: |
          if [ -z "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "::error::Lipsesc secretele ANDROID_RELEASE_*. APK-ul de debug nu e autentificat."
            exit 1
          fi
          echo "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          cat > release-keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          EOF
      - name: Află versiunea aplicației
        id: versiune
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Construiește APK-ul semnat
        working-directory: android
        env:
          VERSIUNE: ${{ steps.versiune.outputs.value }}
        run: |
          gradle_cu_reincercari assembleRelease
          apk="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" "app/build/outputs/apk/release/Buget-Familie-$VERSIUNE.apk"
          signer="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner | sort | tail -n 1)"
          "$signer" verify --verbose --print-certs "app/build/outputs/apk/release/Buget-Familie-$VERSIUNE.apk"
      - name: Șterge keystore-ul de pe runner
        if: always()
        working-directory: android/app
        run: rm -f release.keystore release-keystore.properties
      - name: Publică APK-ul ca artefact GitHub
        uses: actions/upload-artifact@v6
        with:
          name: Buget-Familie-${{ steps.versiune.outputs.value }}
          path: android/app/build/outputs/apk/release/Buget-Familie-${{ steps.versiune.outputs.value }}.apk
          retention-days: 14
      - name: Dovadă că APK-ul a ieșit din acest workflow
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: android/app/build/outputs/apk/release/Buget-Familie-${{ steps.versiune.outputs.value }}.apk