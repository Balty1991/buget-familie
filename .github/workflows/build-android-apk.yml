name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: APK de test instalabil
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Instalează dependențele exacte
        run: pnpm install --frozen-lockfile
      - name: Verifică tipurile
        run: pnpm check
      - name: Rulează testele financiare
        run: pnpm exec vitest run client/src/lib/finance-data.test.ts
      - name: Construiește bundle-ul Android
        run: pnpm run cap:sync
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Numele fișierului urmează versiunea din pachet. Scris de mână, rămânea în urmă:
      # un APK cu 1.1.44 înăuntru se descărca numit „1.1.39”, deci nu se știa ce s-a instalat.
      # Descărcarea distribuției Gradle a picat cu 504 de la GitHub, iar buildul s-a oprit
      # acolo: nimic din aplicație nu era greșit, doar rețeaua altcuiva. Încercăm de trei
      # ori, ștergând arhiva pe jumătate descărcată între încercări — altfel a doua
      # încercare ar reciti exact fișierul stricat.
      - name: Pregătește Gradle cu reîncercări
        run: |
          cat >> "$GITHUB_ENV" <<'MEDIU'
          GRADLE_OPTS=-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000
          MEDIU
          cat > "$HOME/gradle-cu-reincercari.sh" <<'SCRIPT'
          gradle_cu_reincercari() {
            for incercare in 1 2 3; do
              if ./gradlew "$@"; then return 0; fi
              echo "::warning::Gradle a picat (încercarea $incercare). Curăț distribuția și reîncerc."
              rm -rf "$HOME/.gradle/wrapper/dists"
              sleep $((incercare * 20))
            done
            echo "::error::Gradle a picat de trei ori la rând."
            return 1
          }
          SCRIPT
          echo "BASH_ENV=$HOME/gradle-cu-reincercari.sh" >> "$GITHUB_ENV"
      - name: Află versiunea aplicației
        id: versiune
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Construiește APK-ul debug
        working-directory: android
        env:
          VERSIUNE: ${{ steps.versiune.outputs.value }}
        run: |
          gradle_cu_reincercari assembleDebug
          ls -la app/build/outputs/apk/debug
          apk="$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          cp "$apk" "app/build/outputs/apk/debug/Buget-Familie-$VERSIUNE.apk"
      - name: Publică APK-ul ca artefact GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Buget-Familie-${{ steps.versiune.outputs.value }}
          path: android/app/build/outputs/apk/debug/Buget-Familie-${{ steps.versiune.outputs.value }}.apk
          retention-days: 14
