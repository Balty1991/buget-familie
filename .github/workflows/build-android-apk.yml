name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: APK de test instalabil
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Instalează dependențele exacte
        run: pnpm install --frozen-lockfile
      - name: Verifică tipurile
        run: pnpm check
      - name: Rulează testele financiare
        run: pnpm exec vitest run client/src/lib/finance-data.test.ts
      - name: Construiește bundle-ul Android
        run: pnpm run cap:sync
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Construiește APK-ul debug
        working-directory: android
        run: |
          ./gradlew assembleDebug
          ls -la app/build/outputs/apk/debug
          apk="$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          cp "$apk" "app/build/outputs/apk/debug/Buget-Familie-1.1.35.apk"
      - name: Publică APK-ul ca artefact GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Buget-Familie-1.1.35
          path: android/app/build/outputs/apk/debug/Buget-Familie-1.1.35.apk
          retention-days: 14
