name: Sync familie cap-coadă

# Două „telefoane” pe aplicația reală, cu Firestore și Auth locale (emulatoare, fără date reale)
# de două ori: pe regulile etapei 3 (firestore.chain.rules, lanțul de scriere) și pe cele
# publicate acum (etapa 2, firestore.auth.rules):
# invitație, cine a cheltuit, reconectare după redeschidere, mutare de pe parolă.
# Nu oprește publicarea site-ului; arată dacă sincronizarea s-a stricat.

on:
  push:
    branches: [main]
    paths:
      - "client/src/**"
      - "e2e/**"
      - "firestore.rules"
      - "firestore.auth.rules"
      - "firestore.chain.rules"
      - "firebase.json"
      - "firebase.e2e.json"
      - "firebase.e2e.auth.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/sync-e2e.yml"
  pull_request:
    paths:
      - "client/src/**"
      - "e2e/**"
      - "firestore.rules"
      - "firestore.auth.rules"
      - "firestore.chain.rules"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Java (emulatorul Firestore)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache emulator Firestore
        uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Test sync cap-coadă
        timeout-minutes: 12
        run: pnpm test:sync
      - name: Aceeași aplicație pe regulile publicate acum (etapa 2)
        timeout-minutes: 12
        run: pnpm test:sync:current
