name: Interfață pe telefon

# Aplicația reală, cu date de test: ecranele principale × Alb / Întunecat / Navy × 360 și 412 px
# (text ieșit din ecran, strivit, contrast sub WCAG AA, erori) și fluxurile de bază (notare și
# anulare, plic nou, plata ratei, ștergere, ciclu salariu, temă automată).

on:
  push:
    branches: [main]
    paths:
      - "client/src/**"
      - "e2e/layout.e2e.mjs"
      - "e2e/flows.e2e.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/layout-e2e.yml"
  pull_request:
    paths:
      - "client/src/**"
      - "e2e/layout.e2e.mjs"
      - "e2e/flows.e2e.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Verifică interfața
        timeout-minutes: 15
        run: pnpm test:layout
      - name: Verifică fluxurile de bază
        timeout-minutes: 10
        run: pnpm test:flows
