name: Deploy Firebase Functions

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-firebase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-functions-production
  cancel-in-progress: true

env:
  FIREBASE_PROJECT_ID: buget-familie-a6a0d
  FUNCTIONS_REGION: europe-central2

jobs:
  deploy:
    name: Validate and deploy Firebase Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: functions/pnpm-lock.yaml

      - name: Install function dependencies
        working-directory: functions
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type-check Firebase Functions
        working-directory: functions
        run: ./node_modules/.bin/tsc --noEmit

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Sync Gemini secret to Secret Manager
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is not configured in GitHub repository secrets; keeping the existing Firebase secret."
            exit 0
          fi
          if ! gcloud secrets describe GEMINI_API_KEY --project "$FIREBASE_PROJECT_ID" >/dev/null 2>&1; then
            gcloud secrets create GEMINI_API_KEY \
              --project "$FIREBASE_PROJECT_ID" \
              --replication-policy=automatic
          fi
          printf '%s' "$GEMINI_API_KEY" | gcloud secrets versions add GEMINI_API_KEY \
            --project "$FIREBASE_PROJECT_ID" \
            --data-file=-

      - name: Deploy Firebase Functions
        run: npx --yes firebase-tools@latest deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Check aiGuide endpoint
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/aiguide-health.json -w '%{http_code}' \
            -X POST "https://${FUNCTIONS_REGION}-${FIREBASE_PROJECT_ID}.cloudfunctions.net/aiGuide" \
            -H 'content-type: application/json' \
            --data '{"messages":[{"role":"user","text":"test de disponibilitate"}],"context":{}}')
          if [ "$status" = "200" ]; then
            echo "aiGuide endpoint responded successfully."
          else
            echo "aiGuide endpoint returned HTTP $status. Response body:"
            cat /tmp/aiguide-health.json
            exit 1
          fi
