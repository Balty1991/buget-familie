name: Deploy Firebase Functions

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-firebase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-functions-production
  cancel-in-progress: true

env:
  FIREBASE_PROJECT_ID: buget-familie-a6a0d
  FUNCTIONS_REGION: europe-central2

jobs:
  deploy:
    name: Validate and deploy Firebase Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install function dependencies
        working-directory: functions
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Type-check Firebase Functions
        working-directory: functions
        run: ./node_modules/.bin/tsc --noEmit

      - name: Build Firebase Functions
        working-directory: functions
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable Gemini API
        run: gcloud services enable generativelanguage.googleapis.com --project "$FIREBASE_PROJECT_ID"

      - name: Sync Gemini and Groq secrets to Secret Manager
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          sync_secret() {
            local name="$1"
            local value="$2"
            if ! gcloud secrets describe "$name" --project "$FIREBASE_PROJECT_ID" >/dev/null 2>&1; then
              gcloud secrets create "$name" \
                --project "$FIREBASE_PROJECT_ID" \
                --replication-policy=automatic
              printf '%s' "${value:-pending}" | gcloud secrets versions add "$name" \
                --project "$FIREBASE_PROJECT_ID" \
                --data-file=-
              return
            fi
            if [ -n "$value" ]; then
              printf '%s' "$value" | gcloud secrets versions add "$name" \
                --project "$FIREBASE_PROJECT_ID" \
                --data-file=-
            else
              echo "$name is not in GitHub secrets; keeping the existing Firebase secret."
            fi
          }
          sync_secret GEMINI_API_KEY "$GEMINI_API_KEY"
          sync_secret GROQ_API_KEY "$GROQ_API_KEY"

      - name: Deploy Firebase Functions
        run: npx --yes firebase-tools@latest deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive --force

      - name: Check aiGuide endpoint
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/aiguide-health.json -w '%{http_code}' \
            -X POST "https://${FUNCTIONS_REGION}-${FIREBASE_PROJECT_ID}.cloudfunctions.net/aiGuide" \
            -H 'content-type: application/json' \
            --data '{"messages":[{"role":"user","text":"test de disponibilitate"}],"context":{}}')
          if [ "$status" = "200" ] || [ "$status" = "429" ]; then
            echo "aiGuide endpoint responded successfully (HTTP $status)."
          else
            echo "aiGuide endpoint returned HTTP $status. Response body:"
            cat /tmp/aiguide-health.json
            exit 1
          fi
