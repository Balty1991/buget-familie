name: Release Android AAB

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  release-aab:
    name: AAB semnat pentru Google Play
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Instalează dependențele exacte
        run: pnpm install --frozen-lockfile
      - name: Verifică tipurile
        run: pnpm check
      - name: Verifică stilul codului
        run: pnpm lint
      - name: Rulează testele
        run: pnpm test
      - name: Construiește bundle-ul Android
        run: pnpm run cap:sync
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Scrie keystore-ul de release din secrete
        working-directory: android/app
        # Secretele intră prin env, nu lipite în script: nu apar în textul comenzii și un „$” din parolă nu se mai expandează.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Lipsesc secretele ANDROID_RELEASE_*. Vezi README → Release Play Store."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > release.keystore
          {
            printf 'storeFile=release.keystore\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > release-keystore.properties
      # Aceeași pază ca la APK: o descărcare de Gradle picată nu e o problemă a aplicației.
      - name: Pregătește Gradle cu reîncercări
        run: |
          cat > "$HOME/gradle-cu-reincercari.sh" <<'SCRIPT'
          gradle_cu_reincercari() {
            for incercare in 1 2 3; do
              if ./gradlew "$@"; then return 0; fi
              echo "::warning::Gradle a picat (încercarea $incercare). Curăț distribuția și reîncerc."
              rm -rf "$HOME/.gradle/wrapper/dists"
              sleep $((incercare * 20))
            done
            echo "::error::Gradle a picat de trei ori la rând."
            return 1
          }
          SCRIPT
          echo "BASH_ENV=$HOME/gradle-cu-reincercari.sh" >> "$GITHUB_ENV"
      - name: Construiește AAB-ul semnat
        working-directory: android
        run: gradle_cu_reincercari bundleRelease
      - name: Șterge keystore-ul de pe runner
        if: always()
        working-directory: android/app
        run: rm -f release.keystore release-keystore.properties
      - name: Publică AAB-ul ca artefact GitHub
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buget-familie-release-aab
          # archivesBaseName = "Buget-Familie", deci fișierul e Buget-Familie-release.aab, nu app-release.aab.
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
      - name: Dovadă că AAB-ul a ieșit din acest workflow
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: android/app/build/outputs/bundle/release/*.aab
