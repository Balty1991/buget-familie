<!doctype html>
<html lang="ro">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Buget Familie — atelierul deciziilor financiare</title>
    <meta name="description" content="Un spațiu personal sau comun pentru buget, datorii, economii și decizii financiare clare." />
    <meta name="theme-color" content="#E4E9E6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="bf-favicon.svg?v=42" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=42" />
    <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png?v=42" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=42" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      html, body, #root { margin: 0; background: #E4E9E6; min-height: 100%; }
      html.dark, html.dark body, html.dark #root { background: #0B0F0E; }
    </style>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) { void reg.update(); });
        });
      }
    </script>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var legacy = { snow: "white", ivory: "white", ink: "white", sand: "white", sage: "white", slate: "white", lagoon: "cyber", forest: "cyber", midnight: "aurora", plum: "aurora", graphite: "dark", copper: "dark", rosewood: "dark" };
          var theme = localStorage.getItem("buget-familie:theme") || "white";
          if (legacy[theme]) theme = legacy[theme];
          var schedule = localStorage.getItem("buget-familie:theme-schedule");
          if (schedule === "auto") {
            var now = new Date();
            var minutes = now.getHours() * 60 + now.getMinutes();
            var times = { dayStart: "06:00", eveningStart: "17:00", nightStart: "21:00" };
            try {
              var saved = JSON.parse(localStorage.getItem("buget-familie:theme-schedule-times") || "null");
              if (saved) Object.assign(times, saved);
            } catch (e) {}
            var toMin = function (value, fallback) {
              var parts = String(value || "").split(":");
              var hours = Number(parts[0]);
              var mins = Number(parts[1]);
              return Number.isFinite(hours) && Number.isFinite(mins) ? hours * 60 + mins : fallback;
            };
            var day = toMin(times.dayStart, 360);
            var evening = toMin(times.eveningStart, 1020);
            var night = toMin(times.nightStart, 1260);
            theme = minutes >= day && minutes < evening ? "white" : minutes >= evening && minutes < night ? "cyber" : "dark";
          }
          var known = { white: 1, dark: 1, aurora: 1, navy: 1, cyber: 1 };
          if (!known[theme]) theme = "white";
          var background = localStorage.getItem("buget-familie:background") || "plain";
          if (!{ plain: 1, paper: 1, grid: 1, aurora: 1, dots: 1 }[background]) background = "plain";
          root.classList.add("theme-" + theme, "background-" + background);
          var dark = theme !== "white";
          if (dark) root.classList.add("dark");
          var paint = dark ? "#0B0F0E" : "#E4E9E6";
          root.style.backgroundColor = paint;
          root.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", paint);
          if (localStorage.getItem("buget-familie:high-contrast") === "true") root.classList.add("bf-high-contrast");
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
